<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noir - Speed/Tempo Audio Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(20, 20, 20, 0.9);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 2px dashed rgba(255, 107, 53, 0.3);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .upload-area:hover {
            border-color: rgba(255, 107, 53, 0.6);
            background: rgba(255, 107, 53, 0.05);
        }
        
        .upload-area.dragover {
            border-color: #ff6b35;
            background: rgba(255, 107, 53, 0.1);
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-weight: 500;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        input[type="number"], input[type="range"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
        }
        
        input[type="range"] {
            padding: 0;
            height: 8px;
            cursor: pointer;
        }
        
        input[type="number"] {
            width: 120px;
            flex: 0 0 120px;
        }
        
        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        
        .preset-btn {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 107, 53, 0.3);
            background: rgba(255, 107, 53, 0.1);
            color: #ff6b35;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .preset-btn:hover {
            background: rgba(255, 107, 53, 0.2);
            border-color: #ff6b35;
        }
        
        .btn {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .audio-controls {
            margin-top: 20px;
            display: none;
        }
        
        .audio-controls.active {
            display: block;
        }
        
        .audio-player {
            width: 100%;
            margin: 20px 0;
            border-radius: 8px;
        }
        
        .status {
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            font-weight: 500;
        }
        
        .status.processing {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        .status.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }
        
        .status.error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }
        
        .progress {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
            display: none;
        }
        
        .progress.active {
            display: block;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b35, #f7931e);
            width: 0%;
            transition: width 0.3s;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #999;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #ff6b35;
        }
        
        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Speed/Tempo Audio</h1>
        <p class="subtitle">Change audio speed, tempo, or BPM - Standalone tool</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <p>Drop audio file here or click to select</p>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">
                Supports MP3, WAV, FLAC, M4A, OGG, AAC
            </p>
            <input type="file" id="fileInput" accept="audio/*">
        </div>
        
        <div id="status" class="status" style="display: none;"></div>
        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="controls" id="controls" style="display: none;">
            <div class="control-group">
                <label>Speed Multiplier</label>
                <div class="input-group">
                    <input type="range" id="speedSlider" min="0.25" max="4" step="0.05" value="1">
                    <input type="number" id="speedInput" min="0.25" max="4" step="0.05" value="1">
                </div>
                <p class="info-text">1.0 = Normal speed | 2.0 = 2x faster | 0.5 = Half speed</p>
            </div>
            
            <div class="preset-buttons">
                <button class="preset-btn" data-speed="0.5">0.5x (Half Speed)</button>
                <button class="preset-btn" data-speed="0.75">0.75x (Slow)</button>
                <button class="preset-btn" data-speed="1.25">1.25x (Fast)</button>
                <button class="preset-btn" data-speed="2.0">2.0x (Double Speed)</button>
            </div>
            
            <button class="btn" id="processBtn">Process Audio</button>
        </div>
        
        <div class="audio-controls" id="audioControls">
            <h3 style="margin: 20px 0 10px 0;">Original Audio</h3>
            <audio id="originalAudio" class="audio-player" controls></audio>
            
            <h3 style="margin: 20px 0 10px 0;">Processed Audio</h3>
            <audio id="processedAudio" class="audio-player" controls></audio>
            
            <button class="btn" id="downloadBtn" style="margin-top: 20px;">Download Processed Audio</button>
        </div>
        
        <a href="http://localhost:8080" class="back-link">← Back to Noir</a>
    </div>

    <script>
        let selectedFile = null;
        let processedAudioUrl = null;
        let originalAudioUrl = null;
        let currentSpeed = 1.0;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const processBtn = document.getElementById('processBtn');
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const audioControls = document.getElementById('audioControls');
        const originalAudio = document.getElementById('originalAudio');
        const processedAudio = document.getElementById('processedAudio');
        const downloadBtn = document.getElementById('downloadBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedInput = document.getElementById('speedInput');
        const presetButtons = document.querySelectorAll('.preset-btn');

        // Sync slider and input
        speedSlider.addEventListener('input', (e) => {
            speedInput.value = e.target.value;
            currentSpeed = parseFloat(e.target.value);
        });

        speedInput.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            if (value >= 0.25 && value <= 4) {
                speedSlider.value = value;
                currentSpeed = value;
            }
        });

        // Preset buttons
        presetButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const speed = parseFloat(btn.dataset.speed);
                speedSlider.value = speed;
                speedInput.value = speed;
                currentSpeed = speed;
            });
        });

        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('audio/')) {
                showStatus('Please select an audio file', 'error');
                return;
            }

            selectedFile = file;
            originalAudioUrl = URL.createObjectURL(file);
            originalAudio.src = originalAudioUrl;
            
            controls.style.display = 'block';
            processBtn.disabled = false;
            showStatus(`File loaded: ${file.name}`, 'success');
            audioControls.classList.add('active');
        }

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function updateProgress(percent) {
            progress.classList.add('active');
            progressBar.style.width = percent + '%';
        }

        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            processBtn.disabled = true;
            showStatus(`Processing audio at ${currentSpeed}x speed...`, 'processing');
            updateProgress(10);

            try {
                // Create AudioContext
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                updateProgress(30);

                // Load and decode audio
                const arrayBuffer = await selectedFile.arrayBuffer();
                updateProgress(50);
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                updateProgress(70);

                // Calculate new buffer length
                const newLength = Math.floor(audioBuffer.length / currentSpeed);
                const newBuffer = audioContext.createBuffer(
                    audioBuffer.numberOfChannels,
                    newLength,
                    audioBuffer.sampleRate
                );

                // Resample each channel
                for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
                    const originalData = audioBuffer.getChannelData(channel);
                    const newData = newBuffer.getChannelData(channel);
                    
                    for (let i = 0; i < newLength; i++) {
                        const sourceIndex = Math.floor(i * currentSpeed);
                        if (sourceIndex < originalData.length) {
                            newData[i] = originalData[sourceIndex];
                        }
                    }
                }

                updateProgress(90);

                // Convert to WAV
                const wavBlob = audioBufferToWav(newBuffer);
                processedAudioUrl = URL.createObjectURL(wavBlob);
                processedAudio.src = processedAudioUrl;

                updateProgress(100);
                showStatus(`Audio processed at ${currentSpeed}x speed!`, 'success');
                processBtn.disabled = false;

                setTimeout(() => {
                    progress.classList.remove('active');
                }, 1000);

            } catch (error) {
                console.error('Error processing audio:', error);
                showStatus(`Error: ${error.message}`, 'error');
                processBtn.disabled = false;
                progress.classList.remove('active');
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (!processedAudioUrl) return;
            
            const a = document.createElement('a');
            a.href = processedAudioUrl;
            a.download = selectedFile.name.replace(/\.[^/.]+$/, '') + `_${currentSpeed}x.wav`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // AudioBuffer to WAV converter
        function audioBufferToWav(buffer) {
            const numberOfChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1;
            const bitDepth = 16;
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numberOfChannels * bytesPerSample;

            const length = buffer.length * numberOfChannels * bytesPerSample + 44;
            const arrayBuffer = new ArrayBuffer(length);
            const view = new DataView(arrayBuffer);
            const samples = [];

            for (let channel = 0; channel < numberOfChannels; channel++) {
                const channelData = buffer.getChannelData(channel);
                for (let i = 0; i < channelData.length; i++) {
                    const sample = Math.max(-1, Math.min(1, channelData[i]));
                    samples.push(sample < 0 ? sample * 0x8000 : sample * 0x7FFF);
                }
            }

            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, length - 8, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numberOfChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, length - 44, true);

            let offset = 44;
            for (let i = 0; i < samples.length; i++) {
                view.setInt16(offset, samples[i], true);
                offset += 2;
            }

            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        window.addEventListener('beforeunload', () => {
            if (originalAudioUrl) URL.revokeObjectURL(originalAudioUrl);
            if (processedAudioUrl) URL.revokeObjectURL(processedAudioUrl);
        });
    </script>
</body>
</html>
