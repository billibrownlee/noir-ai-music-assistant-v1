<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noir - Reverse Audio Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(20, 20, 20, 0.9);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 2px dashed rgba(255, 107, 53, 0.3);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .upload-area:hover {
            border-color: rgba(255, 107, 53, 0.6);
            background: rgba(255, 107, 53, 0.05);
        }
        
        .upload-area.dragover {
            border-color: #ff6b35;
            background: rgba(255, 107, 53, 0.1);
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .btn {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .audio-controls {
            margin-top: 20px;
            display: none;
        }
        
        .audio-controls.active {
            display: block;
        }
        
        .audio-player {
            width: 100%;
            margin: 20px 0;
            border-radius: 8px;
        }
        
        .status {
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            font-weight: 500;
        }
        
        .status.processing {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        .status.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }
        
        .status.error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }
        
        .progress {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
            display: none;
        }
        
        .progress.active {
            display: block;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b35, #f7931e);
            width: 0%;
            transition: width 0.3s;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #999;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #ff6b35;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Reverse Audio</h1>
        <p class="subtitle">Standalone audio reversal tool - Works independently</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <p>Drop audio file here or click to select</p>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">
                Supports MP3, WAV, FLAC, M4A, OGG, AAC
            </p>
            <input type="file" id="fileInput" accept="audio/*">
        </div>
        
        <div id="status" class="status" style="display: none;"></div>
        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <button class="btn" id="reverseBtn" disabled>Reverse Audio</button>
        
        <div class="audio-controls" id="audioControls">
            <h3 style="margin: 20px 0 10px 0;">Original Audio</h3>
            <audio id="originalAudio" class="audio-player" controls></audio>
            
            <h3 style="margin: 20px 0 10px 0;">Reversed Audio</h3>
            <audio id="reversedAudio" class="audio-player" controls></audio>
            
            <button class="btn" id="downloadBtn" style="margin-top: 20px;">Download Reversed Audio</button>
        </div>
        
        <a href="http://localhost:8080" class="back-link">← Back to Noir</a>
    </div>

    <script>
        let selectedFile = null;
        let reversedAudioUrl = null;
        let originalAudioUrl = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const reverseBtn = document.getElementById('reverseBtn');
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const audioControls = document.getElementById('audioControls');
        const originalAudio = document.getElementById('originalAudio');
        const reversedAudio = document.getElementById('reversedAudio');
        const downloadBtn = document.getElementById('downloadBtn');

        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('audio/')) {
                showStatus('Please select an audio file', 'error');
                return;
            }

            selectedFile = file;
            originalAudioUrl = URL.createObjectURL(file);
            originalAudio.src = originalAudioUrl;
            
            reverseBtn.disabled = false;
            showStatus(`File loaded: ${file.name}`, 'success');
            audioControls.classList.add('active');
        }

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function updateProgress(percent) {
            progress.classList.add('active');
            progressBar.style.width = percent + '%';
        }

        reverseBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            reverseBtn.disabled = true;
            showStatus('Processing audio...', 'processing');
            updateProgress(10);

            try {
                // Create AudioContext
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                updateProgress(30);

                // Load and decode audio
                const arrayBuffer = await selectedFile.arrayBuffer();
                updateProgress(50);
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                updateProgress(70);

                // Create reversed buffer with EXACT same properties (pitch and speed stay the same)
                const reversedBuffer = audioContext.createBuffer(
                    audioBuffer.numberOfChannels,
                    audioBuffer.length,
                    audioBuffer.sampleRate  // Same sample rate = same pitch and speed
                );

                // Reverse each channel - simple array reversal (no resampling, no pitch change)
                for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
                    const originalData = audioBuffer.getChannelData(channel);
                    const reversedData = reversedBuffer.getChannelData(channel);
                    
                    // Direct reversal - just flip the array, no processing
                    // This preserves pitch and speed exactly
                    for (let i = 0; i < originalData.length; i++) {
                        reversedData[i] = originalData[originalData.length - 1 - i];
                    }
                }

                updateProgress(90);

                // Convert to WAV - preserve original sample rate exactly (no pitch change)
                // Store original sample rate before conversion
                const originalSampleRate = audioBuffer.sampleRate;
                const wavBlob = audioBufferToWav(reversedBuffer, originalSampleRate);
                reversedAudioUrl = URL.createObjectURL(wavBlob);
                reversedAudio.src = reversedAudioUrl;

                updateProgress(100);
                showStatus('Audio reversed successfully!', 'success');
                reverseBtn.disabled = false;

                // Hide progress after a moment
                setTimeout(() => {
                    progress.classList.remove('active');
                }, 1000);

            } catch (error) {
                console.error('Error reversing audio:', error);
                showStatus(`Error: ${error.message}`, 'error');
                reverseBtn.disabled = false;
                progress.classList.remove('active');
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (!reversedAudioUrl) return;
            
            const a = document.createElement('a');
            a.href = reversedAudioUrl;
            a.download = selectedFile.name.replace(/\.[^/.]+$/, '') + '_reversed.wav';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // AudioBuffer to WAV converter - preserves exact sample rate
        function audioBufferToWav(buffer, originalSampleRate = null) {
            const numberOfChannels = buffer.numberOfChannels;
            // Use original sample rate if provided, otherwise use buffer's sample rate
            const sampleRate = originalSampleRate || buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numberOfChannels * bytesPerSample;

            const length = buffer.length * numberOfChannels * bytesPerSample + 44;
            const arrayBuffer = new ArrayBuffer(length);
            const view = new DataView(arrayBuffer);
            const samples = [];

            // Convert float samples to 16-bit PCM - no resampling, no pitch change
            for (let channel = 0; channel < numberOfChannels; channel++) {
                const channelData = buffer.getChannelData(channel);
                for (let i = 0; i < channelData.length; i++) {
                    const sample = Math.max(-1, Math.min(1, channelData[i]));
                    samples.push(sample < 0 ? sample * 0x8000 : sample * 0x7FFF);
                }
            }

            // WAV header
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, length - 8, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numberOfChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, length - 44, true);

            // Write samples
            let offset = 44;
            for (let i = 0; i < samples.length; i++) {
                view.setInt16(offset, samples[i], true);
                offset += 2;
            }

            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (originalAudioUrl) URL.revokeObjectURL(originalAudioUrl);
            if (reversedAudioUrl) URL.revokeObjectURL(reversedAudioUrl);
        });
    </script>
</body>
</html>
